<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA SOUND - 로컬 파일 및 클라우드 통합 뮤직 플레이어</title>
  <style>
    :root {
      --bg-base: #121212;
      --bg-elevated: #181818;
      --bg-highlight: #282828;
      --text-base: #ffffff;
      --text-subdued: #a7a7a7;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --accent-soft: rgba(29, 185, 84, 0.18);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: var(--text-base);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Main Layout */
    .app-container {
      display: flex;
      flex: 1;
      gap: 8px;
      padding: 8px 8px 0 8px;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 270px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .nav-card, .library-card {
      background-color: var(--bg-base);
      border-radius: 8px;
      padding: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-base);
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 1.15rem;
      transition: background 0.3s;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 8px;
      color: var(--text-subdued);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-base);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .library-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      color: var(--text-subdued);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--text-base);
      background-color: var(--bg-highlight);
    }

    .library-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .library-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .library-item:hover, .library-item.active {
      background-color: var(--bg-highlight);
    }

    .library-thumb {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #282828;
    }

    .library-info {
      overflow: hidden;
    }

    .library-title {
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-sub {
      font-size: 0.78rem;
      color: var(--text-subdued);
      margin-top: 2px;
    }

    /* Main Content Area */
    .main-view {
      flex: 1;
      background: linear-gradient(180deg, #222222 0%, var(--bg-base) 260px);
      border-radius: 8px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #242424;
      border-radius: 500px;
      padding: 8px 16px;
      width: 280px;
      max-width: 100%;
      gap: 10px;
      border: 1px solid transparent;
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
    }

    .topbar-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Theme Color Picker Pill */
    .theme-picker-box {
      display: flex;
      align-items: center;
      gap: 7px;
      background-color: #242424;
      padding: 6px 12px;
      border-radius: 500px;
      border: 1px solid var(--border-subtle);
    }

    .theme-label {
      font-size: 0.75rem;
      color: var(--text-subdued);
      font-weight: 600;
      margin-right: 2px;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.18);
    }

    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .custom-color-input {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
    }
    .custom-color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    .custom-color-input::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000000;
      border: none;
      border-radius: 500px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: transform 0.15s, background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: scale(1.03);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-base);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 500px;
      padding: 9px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.18);
    }

    .content-padding {
      padding: 12px 24px 40px 24px;
    }

    .section-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
    }

    /* Album Grid */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .album-card {
      background-color: var(--bg-elevated);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s;
      position: relative;
    }

    .album-card:hover {
      background-color: var(--bg-highlight);
    }

    .album-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .album-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .album-card:hover .card-play-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .card-play-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.06);
    }

    .album-card-title {
      font-weight: 700;
      font-size: 0.98rem;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-card-meta {
      font-size: 0.82rem;
      color: var(--text-subdued);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Album Detail View */
    .album-hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 16px 0 28px 0;
    }

    .hero-cover {
      width: 210px;
      height: 210px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-badge {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .hero-desc {
      color: var(--text-subdued);
      font-size: 0.9rem;
    }

    .hero-meta {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .album-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .big-play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s;
    }

    .big-play-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.05);
    }

    .danger-btn {
      background-color: rgba(255, 75, 75, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 500px;
      padding: 9px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .danger-btn:hover {
      background-color: rgba(255, 75, 75, 0.28);
    }

    /* Tracklist Table */
    .track-table {
      width: 100%;
      border-collapse: collapse;
    }

    .track-table th {
      text-align: left;
      color: var(--text-subdued);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .track-row {
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .track-row:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .track-row.playing td {
      color: var(--accent);
    }

    .track-row td {
      padding: 12px;
      font-size: 0.92rem;
    }

    .track-num {
      width: 44px;
      color: var(--text-subdued);
      text-align: center;
    }

    .track-title-cell {
      font-weight: 600;
    }

    .format-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: var(--accent-soft);
      color: var(--accent);
      margin-left: 8px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    .cloud-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(59, 130, 246, 0.18);
      color: #3b82f6;
      margin-left: 8px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    .lyrics-tag {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.12);
      color: #e0e0e0;
      margin-left: 6px;
      vertical-align: middle;
    }

    .track-artist-sub {
      display: block;
      font-size: 0.78rem;
      color: var(--text-subdued);
      font-weight: 400;
      margin-top: 2px;
    }

    .track-duration {
      text-align: right;
      color: var(--text-subdued);
      width: 80px;
    }

    /* Right Lyrics Panel */
    .lyrics-panel {
      width: 330px;
      background-color: var(--bg-base);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }

    .lyrics-panel.open {
      display: flex;
    }

    .lyrics-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-elevated);
    }

    .lyrics-header-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
    }

    .lyrics-song-meta {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
    }

    .lyrics-body {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
      font-size: 1.02rem;
      line-height: 1.85;
      color: #e5e5e5;
      white-space: pre-wrap;
      user-select: text;
    }

    .lyrics-empty {
      color: var(--text-subdued);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 40px;
      line-height: 1.6;
    }

    .lyrics-edit-area {
      width: 100%;
      height: 100%;
      min-height: 260px;
      background-color: #181818;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    /* Player Bar */
    .player-bar {
      height: 88px;
      background-color: #000000;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-top: 1px solid var(--border-subtle);
    }

    .now-playing {
      width: 30%;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 180px;
    }

    .np-cover {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #282828;
    }

    .np-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .np-artist {
      font-size: 0.76rem;
      color: var(--text-subdued);
    }

    .player-controls {
      width: 40%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      color: var(--accent);
    }

    .play-pause-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .play-pause-btn:hover {
      transform: scale(1.06);
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--text-subdued);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #4d4d4d;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .progress-bar {
      flex: 1;
    }

    .volume-controls {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--text-subdued);
    }

    .lyrics-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: var(--text-subdued);
      border-radius: 500px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .lyrics-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }

    .lyrics-toggle-btn.active {
      color: #000000;
      background-color: var(--accent);
    }

    .volume-slider {
      width: 90px;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background-color: #222222;
      width: 100%;
      max-width: 580px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e0e0e0;
    }

    .form-input, .form-textarea {
      width: 100%;
      background-color: #121212;
      border: 1px solid #3e3e3e;
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent);
    }

    /* Cover Upload & Preview */
    .cover-setup-box {
      display: flex;
      gap: 14px;
      align-items: center;
      background: #181818;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .cover-preview-img {
      width: 84px;
      height: 84px;
      border-radius: 6px;
      object-fit: cover;
      background: #282828;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .cover-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-dropzone {
      border: 2px dashed #444444;
      border-radius: 8px;
      padding: 18px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      background: #181818;
    }

    .file-dropzone:hover, .file-dropzone.dragover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }

    .format-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .format-pill {
      font-size: 0.7rem;
      background: #2a2a2a;
      color: #cccccc;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Track Order / Staged Files List */
    .selected-files-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;

      padding: 10px;
      border-radius: 6px;

      gap: 8px;

      gap: 8px;

      color: var(--accent);

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .track-chip-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .order-btn {

      border: 1px solid #3e3e3e;
      color: #e0e0e0;

      font-size: 0.75rem;

      height: 24px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .order-btn:hover:not(:disabled) {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .order-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .lyrics-mini-btn {

      border: 1px solid #3e3e3e;
      color: #cccccc;
      cursor: pointer;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .lyrics-mini-btn:hover, .lyrics-mini-btn.has-lyrics {
      border-color: var(--accent);
      color: var(--accent);
    }

    .remove-file-btn {
      background: transparent;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 3px 6px;
      border-radius: 4px;
      margin-left: 2px;
    }

    .remove-file-btn:hover {
      background: rgba(255, 107, 107, 0.15);
    }

    .staged-lyrics-box {
      display: none;
    }
    .staged-lyrics-box.open {
      display: block;
    }

    .url-add-row {
      display: flex;
      gap: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 104px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 22px;
      border-radius: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);

      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    ::-webkit-scrollbar {

    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {

      }

        width: 55%;
      }

  <script>
    /* ==========================================
       메인 포인트 컬러(테마) 설정 로직
    ========================================== */
    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function lightenHex(hex, percent) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      let r = (num >> 16) + Math.round(2.55 * percent);
      let g = ((num >> 8) & 0x00FF) + Math.round(2.55 * percent);
      let b = (num & 0x0000FF) + Math.round(2.55 * percent);
      r = Math.min(255, Math.max(0, r));
      g = Math.min(255, Math.max(0, g));
      b = Math.min(255, Math.max(0, b));
      return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
    }

    function setThemeColor(hex, swatchEl) {
      const root = document.documentElement;
      root.style.setProperty('--accent', hex);
      root.style.setProperty('--accent-hover', lightenHex(hex, 12));
      root.style.setProperty('--accent-soft', hexToRgba(hex, 0.18));

      document.querySelectorAll('.color-swatch').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.color && btn.dataset.color.toLowerCase() === hex.toLowerCase()) {
          btn.classList.add('active');
        }
      });

      if (swatchEl) {
        swatchEl.classList.add('active');
      }

      const colorInput = document.getElementById('customThemeColor');
      if (colorInput && /^#[0-9A-Fa-f]{6}$/.test(hex)) {
        colorInput.value = hex;
      }

      try {
        localStorage.setItem('sigma_sound_theme_color', hex);
      } catch (e) {}
    }

    function loadSavedThemeColor() {
      try {
        const saved = localStorage.getItem('sigma_sound_theme_color');
        if (saved) {
          setThemeColor(saved, null);
        }
      } catch (e) {}
    }

    /* ==========================================
       기본 데이터 및 스토리지 로직
    ========================================== */
    function createGradientCover(title, color1, color2) {
      const safeTitle = (title || 'SIGMA SOUND').replace(/[<>&'"]/g, '');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">

        <text x="28" y="345" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="800">${safeTitle.slice(0, 14)}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    const DEFAULT_ALBUMS = [
      {
        id: 'alb-default-1',
        title: 'Sigma Ambient Suite',
        artist: 'SIGMA SOUND',
        description: '기본 제공되는 고품질 앰비언트 사운드 앨범입니다.',
        cover: createGradientCover('Ambient Suite', '#1db954', '#0ea5e9'),
        tracks: [
          {
            id: 't-1',
            title: 'SoundHelix Wave 1',
            format: 'MP3',
            isCloud: true,

    function getStoredAlbums() {
      try {
        const data = localStorage.getItem('sigma_sound_albums_v5');
        if (data) {
          return JSON.parse(data);
        }
      } catch(e) {}
      return DEFAULT_ALBUMS;
    }

    function saveStoredAlbums(list) {
      try {
        localStorage.setItem('sigma_sound_albums_v5', JSON.stringify(list));
      } catch(e) {
        alert('저장 공간이 부족합니다! 파일 용량이 너무 클 수 있습니다.');
      }
    }

    let albums = getStoredAlbums();
    let stagedTracks = [];
    let customCoverData = null;
    let defaultPreviewPalette = ['#1db954', '#0ea5e9'];
    let draggedTrackIndex = null;

    let currentView = 'home';
    let selectedAlbumId = null;
    let currentAlbum = null;
    let currentTrackIndex = -1;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;
    let isEditingLyrics = false;

    const htmlAudio = new Audio();
    htmlAudio.volume = 0.8;
    let currentMode = 'none';

    htmlAudio.addEventListener('timeupdate', () => {
      if ((currentMode === 'file' || currentMode === 'blob') && htmlAudio.duration) {
        const pct = (htmlAudio.currentTime / htmlAudio.duration) * 100;
        document.getElementById('progressBar').value = pct;
        document.getElementById('currentTime').textContent = formatTime(htmlAudio.currentTime);
        document.getElementById('totalTime').textContent = formatTime(htmlAudio.duration);
      }
    });

    htmlAudio.addEventListener('ended', () => {
      handleTrackEnd();
    });

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function renderLibrary() {
      const list = document.getElementById('libraryList');
      list.innerHTML = albums.map(alb => `
        <div class="library-item ${selectedAlbumId === alb.id && currentView === 'album' ? 'active' : ''}" onclick="openAlbum('${alb.id}')">
          <img class="library-thumb" src="${alb.cover}" alt="${alb.title}" />
          <div class="library-info">
            <div class="library-title">${alb.title}</div>
            <div class="library-sub">${alb.artist} • ${alb.tracks.length}곡</div>

    }

      currentView = 'home';
      selectedAlbumId = null;
      document.getElementById('navHome').classList.add('active');
      renderLibrary();

      const filtered = albums.filter(a =>
        a.title.toLowerCase().includes(filterText.toLowerCase()) ||

            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>

        <table class="track-table">
          <thead>

            </tr>
          </thead>
          <tbody>
            ${alb.tracks.map((tr, idx) => {
              const isCurrent = currentAlbum && currentAlbum.id === alb.id && currentTrackIndex === idx;
              const hasLyrics = tr.lyrics && tr.lyrics.trim().length > 0;
              return `
                <tr class="track-row ${isCurrent ? 'playing' : ''}" onclick="playAlbum('${alb.id}', ${idx})">
                  <td class="track-num">${isCurrent && isPlaying ? '▶' : idx + 1}</td>
                  <td class="track-title-cell">
                    ${tr.title}
                    <span class="${tr.isCloud ? 'cloud-badge' : 'format-badge'}">${tr.format || 'FILE'}</span>
                    ${hasLyrics ? '<span class="lyrics-tag">가사</span>' : ''}
                    <span class="track-artist-sub">${alb.artist}</span>

                  <td class="track-duration">${formatTime(tr.duration)}</td>
                </tr>

    function deleteAlbum(albumId) {
      const alb = albums.find(a => a.id === albumId);
      if (!alb) return;
      if (confirm(`'${alb.title}' 앨범을 삭제하시겠습니까?`)) {
        if (currentAlbum && currentAlbum.id === albumId) {
          stopAllAudio();
          currentAlbum = null;
          currentTrackIndex = -1;
          isPlaying = false;
          updatePlayPauseIcon();
          document.getElementById('npCover').src = '';
          document.getElementById('npTitle').textContent = '재생 중인 곡 없음';
          document.getElementById('npArtist').textContent = 'SIGMA SOUND에서 앨범을 선택하세요';
          renderLyricsPanel();
        }
        albums = albums.filter(a => a.id !== albumId);
        saveStoredAlbums(albums);
        renderLibrary();
        showHome();
        showToast(`'${alb.title}' 앨범이 삭제되었습니다.`);
      }
    }

    function stopAllAudio() {
      htmlAudio.pause();
      htmlAudio.src = '';
    }

    function playAlbum(albumId, trackIndex) {
      const alb = albums.find(a => a.id === albumId);
      if (!alb || !alb.tracks[trackIndex]) return;

      stopAllAudio();
      currentAlbum = alb;
      currentTrackIndex = trackIndex;
      isEditingLyrics = false;
      const track = alb.tracks[trackIndex];

      document.getElementById('npCover').src = alb.cover;
      document.getElementById('npTitle').textContent = track.title;
      document.getElementById('npArtist').textContent = `${alb.artist} • ${alb.title}`;
      document.getElementById('progressBar').value = 0;
      document.getElementById('currentTime').textContent = '0:00';
      document.getElementById('totalTime').textContent = formatTime(track.duration);

      if (track.data) {
        currentMode = 'blob';
        htmlAudio.src = track.data;
      } else if (track.url) {
        currentMode = 'file';
        htmlAudio.src = track.url;
      }

      htmlAudio.play().catch(() => {
        showToast('오디오 재생 실패 또는 브라우저 제한');
      });

      isPlaying = true;
      updatePlayPauseIcon();
      renderLyricsPanel();
      if (currentView === 'album' && selectedAlbumId === albumId) {
        openAlbum(albumId);
      }
    }

    function togglePlay() {
      if (!currentAlbum || currentTrackIndex < 0) {
        if (albums.length > 0) {
          playAlbum(albums[0].id, 0);
        }
        return;
      }

      if (isPlaying) {
        isPlaying = false;
        htmlAudio.pause();
      } else {
        isPlaying = true;
        htmlAudio.play();
      }
      updatePlayPauseIcon();
      if (currentView === 'album' && selectedAlbumId === currentAlbum.id) {
        openAlbum(currentAlbum.id);
      }
    }

    function updatePlayPauseIcon() {
      const icon = document.getElementById('playIcon');
      if (isPlaying) {
        icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function handleTrackEnd() {
      if (isRepeat) {
        playAlbum(currentAlbum.id, currentTrackIndex);
      } else {
        nextTrack();
      }
    }

    function nextTrack() {
      if (!currentAlbum) return;
      let nextIdx;
      if (isShuffle && currentAlbum.tracks.length > 1) {
        nextIdx = Math.floor(Math.random() * currentAlbum.tracks.length);
      } else {
        nextIdx = (currentTrackIndex + 1) % currentAlbum.tracks.length;
      }
      playAlbum(currentAlbum.id, nextIdx);
    }

    function prevTrack() {
      if (!currentAlbum) return;
      const prevIdx = (currentTrackIndex - 1 + currentAlbum.tracks.length) % currentAlbum.tracks.length;
      playAlbum(currentAlbum.id, prevIdx);
    }

    function seekTrack(pct) {
      if (!currentAlbum || currentTrackIndex < 0) return;
      if (htmlAudio.duration) {
        htmlAudio.currentTime = (pct / 100) * htmlAudio.duration;
      }
    }

    function setVolume(val) {
      htmlAudio.volume = val;
    }

    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
      showToast(isShuffle ? '셔플 재생 켜짐' : '셔플 재생 꺼짐');
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
      showToast(isRepeat ? '반복 재생 켜짐' : '반복 재생 꺼짐');
    }

    /* ==========================================
       가사 창 (Lyrics Panel) 로직
    ========================================== */
    function toggleLyricsPanel() {
      const panel = document.getElementById('lyricsPanel');
      const btn = document.getElementById('lyricsToggleBtn');
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('active', isOpen);
      if (isOpen) {
        renderLyricsPanel();
      }
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderLyricsPanel() {
      const titleEl = document.getElementById('lyricsTrackTitle');
      const artistEl = document.getElementById('lyricsTrackArtist');
      const editBtn = document.getElementById('editLyricsBtn');
      const bodyEl = document.getElementById('lyricsBody');

      if (!currentAlbum || currentTrackIndex < 0 || !currentAlbum.tracks[currentTrackIndex]) {
        titleEl.textContent = '재생 중인 곡 없음';
        artistEl.textContent = '곡을 재생하면 가사가 표시됩니다';
        editBtn.style.display = 'none';
        bodyEl.innerHTML = `<div class="lyrics-empty">재생 중인 곡이 없습니다.<br>앨범에서 곡을 선택해 재생해 보세요.</div>`;
        return;
      }

      const track = currentAlbum.tracks[currentTrackIndex];
      titleEl.textContent = track.title;
      artistEl.textContent = `${currentAlbum.artist} • ${currentAlbum.title}`;
      editBtn.style.display = 'inline-flex';

      if (isEditingLyrics) {
        editBtn.textContent = '저장하기';
        editBtn.style.backgroundColor = 'var(--accent)';
        editBtn.style.color = '#000';
        bodyEl.innerHTML = `<textarea id="lyricsEditTextarea" class="lyrics-edit-area" placeholder="이 곡의 가사를 입력하세요...">${escapeHtml(track.lyrics || '')}</textarea>`;
      } else {
        editBtn.textContent = '가사 편집';
        editBtn.style.backgroundColor = '';
        editBtn.style.color = '';
        if (track.lyrics && track.lyrics.trim().length > 0) {
          bodyEl.innerHTML = `<div>${escapeHtml(track.lyrics)}</div>`;
        } else {
          bodyEl.innerHTML = `<div class="lyrics-empty">등록된 가사가 없습니다.<br><br>우측 상단 <b>[가사 편집]</b> 버튼을 눌러<br>가사를 직접 입력하고 저장할 수 있습니다.</div>`;
        }
      }
    }

    function toggleLyricsEditMode() {
      if (!currentAlbum || currentTrackIndex < 0) return;

      if (isEditingLyrics) {
        const textarea = document.getElementById('lyricsEditTextarea');
        const newLyrics = textarea ? textarea.value : '';
        currentAlbum.tracks[currentTrackIndex].lyrics = newLyrics;
        saveStoredAlbums(albums);
        isEditingLyrics = false;
        renderLyricsPanel();
        if (currentView === 'album' && selectedAlbumId === currentAlbum.id) {
          openAlbum(currentAlbum.id);
        }
        showToast('가사가 저장되었습니다!');
      } else {
        isEditingLyrics = true;
        renderLyricsPanel();
      }
    }

    /* ==========================================
       모달 & 앨범 표지 설정 로직

    function openUploadModal() {
      stagedTracks = [];

      const currentAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1db954';
      const palettes = [

      document.getElementById('uploadForm').reset();

      customCoverData = null;

    function updateDefaultCoverPreview() {
      if (customCoverData) return;
      const titleVal = document.getElementById('albumTitleInput').value.trim() || 'SIGMA SOUND';
      document.getElementById('coverPreviewImg').src = createGradientCover(
        titleVal,
        defaultPreviewPalette[0],
        defaultPreviewPalette[1]
      );
    }

    function handleCoverFileSelect(files) {
      if (!files || !files[0]) return;
      const file = files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 400;
          canvas.width = MAX_SIZE;
          canvas.height = MAX_SIZE;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;

          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, MAX_SIZE, MAX_SIZE);
          customCoverData = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('coverPreviewImg').src = customCoverData;
          document.getElementById('coverUrlInput').value = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleCoverUrlInput(url) {
      const trimmed = url.trim();
      if (trimmed) {
        customCoverData = trimmed;
        document.getElementById('coverPreviewImg').src = trimmed;
      } else {
        customCoverData = null;
        updateDefaultCoverPreview();
      }
    }

    function resetCustomCover() {
      customCoverData = null;
      document.getElementById('coverFileInput').value = '';
      document.getElementById('coverUrlInput').value = '';
      updateDefaultCoverPreview();
      showToast('기본 자동 생성 표지로 초기화되었습니다.');
    }

    /* ==========================================
       트랙 추가, 순서 변경 및 초기 가사 입력 로직
    ========================================== */
    function handleFileSelect(files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result;
          const tempAudio = new Audio(base64Data);
          tempAudio.addEventListener('loadedmetadata', () => {
            stagedTracks.push({
              title: file.name.replace(/\.[^/.]+$/, ""),
              format: file.name.split('.').pop().toUpperCase(),
              duration: tempAudio.duration || 180,
              data: base64Data,
              isCloud: false,
              lyrics: '',
              showLyricsInput: false
            });
            renderStagedFiles();
          });
          tempAudio.addEventListener('error', () => {
            stagedTracks.push({
              title: file.name.replace(/\.[^/.]+$/, ""),
              format: file.name.split('.').pop().toUpperCase(),
              duration: 180,
              data: base64Data,
              isCloud: false,
              lyrics: '',
              showLyricsInput: false
            });
            renderStagedFiles();
          });
        };
        reader.readAsDataURL(file);
      });
    }

    async function addCloudTrack() {
      const urlInput = document.getElementById('cloudAudioUrl');
      const titleInput = document.getElementById('cloudTrackTitle');
      const url = urlInput.value.trim();

      if (!url) {
        alert('외부 오디오 스트리밍 링크(URL)를 입력해주세요.');
        return;
      }

      const title = titleInput.value.trim() || `스트리밍 트랙 ${stagedTracks.length + 1}`;
      const duration = await getAudioDuration(url);

      stagedTracks.push({
        title: title,
        format: 'URL',
        duration: duration,
        url: url,
        isCloud: true,
        lyrics: '',
        showLyricsInput: false
      });

      urlInput.value = '';
      titleInput.value = '';
      renderStagedFiles();
      showToast('스트리밍 트랙이 목록에 추가되었습니다.');
    }

    function renderStagedFiles() {
      const section = document.getElementById('trackOrderSection');
      const container = document.getElementById('selectedFilesList');

      if (stagedTracks.length === 0) {
        section.style.display = 'none';
        container.innerHTML = '';
        return;
      }

      section.style.display = 'block';
      container.innerHTML = stagedTracks.map((tr, idx) => {
        const hasLyrics = tr.lyrics && tr.lyrics.trim().length > 0;
        return `
          <div class="selected-file-chip"
               draggable="true"
               ondragstart="onTrackDragStart(event, ${idx})"
               ondragover="onTrackDragOver(event)"
               ondragleave="onTrackDragLeave(event)"
               ondrop="onTrackDrop(event, ${idx})"
               ondragend="onTrackDragEnd(event)">
            <div class="chip-top-row">
              <div class="track-chip-left">
                <span class="drag-handle" title="드래그하여 순서 변경">⋮⋮</span>
                <span class="track-order-num">${idx + 1}</span>
                <span class="track-chip-title">${escapeHtml(tr.title)} <span style="color: var(--text-subdued); font-size: 0.75rem;">(${tr.format})</span></span>
              </div>
              <div class="track-chip-actions">
                <button type="button" class="lyrics-mini-btn ${hasLyrics ? 'has-lyrics' : ''}" onclick="toggleStagedLyrics(${idx})">
                  ${hasLyrics ? '가사 수정' : '+ 가사'}
                </button>
                <button type="button" class="order-btn" title="위로 이동" onclick="moveStagedTrack(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                <button type="button" class="order-btn" title="아래로 이동" onclick="moveStagedTrack(${idx}, 1)" ${idx === stagedTracks.length - 1 ? 'disabled' : ''}>▼</button>
                <button type="button" class="remove-file-btn" title="트랙 제외" onclick="removeStagedFile(${idx})">✕</button>
              </div>
            </div>
            <div class="staged-lyrics-box ${tr.showLyricsInput ? 'open' : ''}">
              <textarea class="form-textarea" rows="3" style="font-size: 0.8rem; padding: 8px;" placeholder="이 곡의 가사를 입력하세요..." oninput="updateStagedLyrics(${idx}, this.value)">${escapeHtml(tr.lyrics || '')}</textarea>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleStagedLyrics(idx) {
      stagedTracks[idx].showLyricsInput = !stagedTracks[idx].showLyricsInput;
      renderStagedFiles();
    }

    function updateStagedLyrics(idx, val) {
      stagedTracks[idx].lyrics = val;
    }

    function moveStagedTrack(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= stagedTracks.length) return;
      const temp = stagedTracks[index];
      stagedTracks[index] = stagedTracks[newIndex];
      stagedTracks[newIndex] = temp;
      renderStagedFiles();
    }

    function removeStagedFile(idx) {
      stagedTracks.splice(idx, 1);
      renderStagedFiles();
    }

    function onTrackDragStart(e, idx) {
      if (e.target.tagName === 'TEXTAREA') {
        e.preventDefault();
        return;
      }
      draggedTrackIndex = idx;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onTrackDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over-item');
    }

    function onTrackDragLeave(e) {
      e.currentTarget.classList.remove('drag-over-item');
    }

    function onTrackDrop(e, targetIdx) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-item');
      if (draggedTrackIndex === null || draggedTrackIndex === targetIdx) return;

      const movedItem = stagedTracks.splice(draggedTrackIndex, 1)[0];
      stagedTracks.splice(targetIdx, 0, movedItem);
      draggedTrackIndex = null;
      renderStagedFiles();
    }

    function onTrackDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      draggedTrackIndex = null;
    }

    function getAudioDuration(url) {
      return new Promise((resolve) => {
        const tempAudio = new Audio();
        tempAudio.src = url;
        tempAudio.addEventListener('loadedmetadata', () => {
          resolve(tempAudio.duration || 180);
        });
        tempAudio.addEventListener('error', () => resolve(180));
      });
    }

    async function createAlbum(e) {
      e.preventDefault();
      const title = document.getElementById('albumTitleInput').value.trim();
      const artist = document.getElementById('albumArtistInput').value.trim();
      const description = document.getElementById('albumDescInput').value.trim();
      const pendingCloudUrl = document.getElementById('cloudAudioUrl').value.trim();
      const pendingCloudTitle = document.getElementById('cloudTrackTitle').value.trim();

      let tracks = [...stagedTracks];

      if (pendingCloudUrl) {
        const duration = await getAudioDuration(pendingCloudUrl);
        tracks.push({
          title: pendingCloudTitle || title,
          format: 'URL',
          duration: duration,
          url: pendingCloudUrl,
          isCloud: true,
          lyrics: ''
        });
      }

      if (tracks.length === 0) {
        alert('최소한 하나 이상의 음악 파일(.mp3 등)을 업로드하거나 스트리밍 링크를 추가해주세요.');
        return;
      }

      const coverUrl = customCoverData || createGradientCover(title, defaultPreviewPalette[0], defaultPreviewPalette[1]);

      const newAlbum = {
        id: `alb-${Date.now()}`,
        title,
        artist,
        description,
        cover: coverUrl,
        tracks: tracks.map((t, idx) => ({
          id: `tr-${Date.now()}-${idx}`,
          title: t.title,
          format: t.format || 'MP3',
          duration: t.duration || 180,
          data: t.data || null,
          url: t.url || null,
          isCloud: t.isCloud || false,
          lyrics: t.lyrics || ''
        }))
      };

      albums.unshift(newAlbum);
      saveStoredAlbums(albums);
      closeUploadModal();
      renderLibrary();
      openAlbum(newAlbum.id);
      showToast(`'${title}' 앨범이 성공적으로 생성되었습니다!`);
    }

    function openShareModal(albumId) {
      const alb = albums.find(a => a.id === albumId);
      if (!alb) return;
      document.getElementById('shareCover').src = alb.cover;
      document.getElementById('shareTitle').textContent = alb.title;
      document.getElementById('shareMeta').textContent = `${alb.artist} • 총 ${alb.tracks.length}곡`;
      document.getElementById('shareUrlInput').value = window.location.href;
      document.getElementById('shareModal').classList.add('open');
    }

    function closeShareModal() {
      document.getElementById('shareModal').classList.remove('open');
    }

    function copyShareLink() {
      const input = document.getElementById('shareUrlInput');
      input.select();
      navigator.clipboard?.writeText(input.value);
      showToast('링크가 클립보드에 복사되었습니다!');
    }

    // Drag and drop zone events
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files);
      }
    });

    // Initialize App
    loadSavedThemeColor();
    if (albums.length > 0) {
      document.getElementById('npCover').src = albums[0].cover;
    }
    renderLibrary();
    showHome();
  </script>
</body>
</html>
